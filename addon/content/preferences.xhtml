<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul">
<head>
  <title>本地翻译设置</title><meta charset="utf-8"/>
  <link rel="stylesheet" href="chrome://global/skin/global.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <script src="chrome://global/content/customElements.js"></script>
</head>
<body class="zt-body">
<div class="zt-prefs">
 <div class="zt-prefs-scroll">
  <section aria-labelledby="profilesheading">

    <div class="zt-config-list"><table class="zt-config-table" aria-label="已保存的模型配置">

    <div class="zt-config-toolbar">

      <div class="zt-button-group"><button id="useconfig" type="button" disabled="disabled">切换为当前配置</button><button id="deleteconfig" class="zt-danger-action" type="button" disabled="disabled">删除</button></div>
    </div>

    <div id="confirmation" class="zt-confirmation" role="alertdialog" aria-labelledby="confirmtext" hidden="hidden">

    </div>
    <div class="zt-button-group"><button id="applycpu" type="button" hidden="hidden">以 CPU 启用此配置</button><button id="canceltest" type="button" hidden="hidden">取消检测</button></div>

  <section class="zt-config-panel" aria-labelledby="paneltitle">

      <div class="zt-field"><label id="executionmode-label" for="executionmode">推理方式</label><xul:menulist id="executionmode" class="zt-select" native="true" crop="end" sizetopopup="none" aria-labelledby="executionmode-label" disabled="true"><xul:menupopup><xul:menuitem value="gpu" label="GPU 优先"/><xul:menuitem value="cpu" label="仅 CPU"/></xul:menupopup></xul:menulist></div>

      <label class="zt-field zt-wide" for="promptTemplate"><span>翻译提示词 <span class="zt-secondary">必填</span></span><textarea id="promptTemplate" rows="4" disabled="disabled" placeholder="必须包含 {text}，可使用 {targetLanguage}"/><span class="zt-secondary">用 {text} 放置原文。目标语言：简体中文。</span></label>

        <label class="zt-field zt-wide" for="chatTemplate"><span>聊天模板</span><textarea id="chatTemplate" rows="3" disabled="disabled" placeholder="留空使用 GGUF 内置模板；没有内置模板时必填"/></label>
      </div></details>
    </div>
    <div class="zt-panel-footer"><span id="savestatus" class="zt-secondary" role="status">点击“新增”创建模型配置。</span><div class="zt-button-group"><button id="canceledit" type="button" hidden="hidden">取消修改</button><button id="saveconfig" class="zt-primary-action" type="button" disabled="disabled">保存当前配置</button></div></div>
  </section>

  <details><summary>通用设置</summary><div class="zt-general-settings">
    <label class="zt-checkbox-row" for="autorelease"><input id="autorelease" type="checkbox"/>空闲时自动释放模型</label>
    <label class="zt-field" for="idle"><span>空闲时长（分钟）</span><input id="idle" type="number" min="1" max="60" step="1" disabled="disabled"/></label>
    <p class="zt-note">关闭后，首次翻译时加载模型，并保持到退出 Zotero 或手动释放。</p>
    <div class="zt-button-group"><button id="selftest" type="button">当前配置自检</button><button id="restart" type="button">重启引擎</button><button id="release" type="button" disabled="disabled">立即释放模型</button></div>
  </div></details>
  <p id="output" class="zt-note" role="status"></p>
 </div>
  <section class="zt-runtime-status" aria-label="当前运行状态" aria-live="polite">
    <span class="zt-secondary">模型状态</span><span id="modelstatus" class="zt-path">未加载</span>
    <span class="zt-secondary">引擎状态</span><span id="status" class="zt-path">未启动</span>
  </section>
  <div class="zt-close-row"><button id="close" type="button">关闭</button></div>
</div>
<script><![CDATA[

const errors = {

  MODEL_FORMAT_UNSUPPORTED: '不是有效 GGUF，或当前引擎不支持此格式或架构。', MODEL_SPLIT_UNSUPPORTED: '仅支持单文件 GGUF，不支持分片模型。',

  GPU_UNAVAILABLE: '未能使用 GPU 加速，请检查显卡与 Vulkan 驱动。', GPU_OUT_OF_MEMORY: 'GPU 显存不足，可减少 GPU 层数或上下文长度。',
  GPU_LOAD_FAILED: 'GPU 试运行失败，可能存在兼容性或资源问题。', TEMPLATE_UNSUPPORTED: '聊天模板无法应用，请检查模板。',
  ENGINE_TIMEOUT: '检测超时，此配置尚未启用。', ENGINE_CRASHED: '推理程序退出，此配置尚未启用。',

function errorText(error) { const value = error && error.message ? error.message : String(error); return errors[value] || value; }

}
function fillFields() {

  for (const [id] of fields) el[id].value = draft ? draft.parameters[id] : '';

el.addconfig.addEventListener('click', async () => {

el.editconfig.addEventListener('click', () => { if (!selectedProfile() || working) return; editing = true; dirty = false; clearTrial(); renderDraft(); el.configname.focus(); });
el.canceledit.addEventListener('click', async () => {

el.executionmode.addEventListener('command', changed);
el.preset.addEventListener('command', () => {

el.canceltest.addEventListener('click', () => { api.cancelModelTest(); el.operationstatus.textContent = '正在取消检测，请等待进程退出…'; });

el.restart.addEventListener('click', () => act('restart', async () => { const result = await api.restartEngine(); el.output.textContent = result.status === 'restarted' ? '引擎已重新加载。' : errorText(result.detail || result.status); }));
el.selftest.addEventListener('click', () => act('selftest', async () => { el.output.textContent = '正在自检…'; el.output.textContent = await api.selfTest(); }));
async function requestClose() {
  if (!(await discardChanges())) return;
  api?.cancelModelTest(); closingAllowed = true; window.close();
}
el.close.addEventListener('click', () => { void requestClose(); });
window.addEventListener('close', event => { if (!closingAllowed && dirty) { event.preventDefault(); void requestClose(); } });
window.addEventListener('beforeunload', event => { if (!closingAllowed && dirty) { event.preventDefault(); event.returnValue = ''; } });
window.addEventListener('unload', () => { if (refreshTimer) clearInterval(refreshTimer); confirmationResolve?.(false); api?.cancelModelTest(); });
window.__ztCloseWithoutPrompt = () => {
  closingAllowed = true;
  if (confirmationResolve) answer(false);
  api?.cancelModelTest(); window.close();
};
window.__ztInit = function (payload) {
  if (api) return;
  api = payload.api;
  for (const preset of api.getModels().presets) el.preset.appendItem(preset.label, preset.id);
  void reloadModels().then(refresh).catch(error => { el.output.textContent = errorText(error); });
  refreshTimer = window.setInterval(refresh, 1000);
};
buttons();
